name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the inherited upstream E2E suite"
        required: false
        type: boolean
        default: false
      os:
        description: "OS to run the E2E suite on"
        required: false
        type: choice
        options:
          - all
          - ubuntu-latest
          - macos-latest
        default: "all"

# npm install rather than npm ci: yauzl-promise, three levels under the
# nw-builder devDependency, reaches @node-rs/crc32, and npm cannot record that
# package's wasm32-wasi subtree from a machine that resolves a native binary
# instead. A lock file written on Windows is therefore always short of two
# @emnapi packages that Linux wants, and npm ci refuses to install. Regenerating
# the lock on Linux would let npm ci come back.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx biome ci src/

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run unit-tests

  # Upstream's Playwright suite drives the layers, palettes, transform, export
  # and preferences UI this fork removes, so most of it cannot pass here. It is
  # kept intact for anyone rebasing on upstream, and runs only when asked for.
  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    needs: [lint, unit-tests]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ inputs.os == 'all' && fromJson('["ubuntu-latest","macos-latest"]') || fromJson(format('["{0}"]', inputs.os)) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps
      - run: npm run e2e
