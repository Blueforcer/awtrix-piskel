<script type="text/html" id="templates/settings/awtrix.html">
  <div class="settings-section awtrix-settings">
    <div class="settings-title">AWTRIX</div>
    <div class="settings-item">
      <label class="row" for="awtrix-name">Icon name</label>
      <input id="awtrix-name" type="text" class="textfield" placeholder="icon name" spellcheck="false" autocomplete="off" />
      <input type="button" class="button button-primary" id="awtrix-save" value="Save to AWTRIX" />
      <input type="button" class="button" id="awtrix-save-cloud" value="Save to Cloud" />
      <div class="save-status" id="awtrix-status"></div>
    </div>
    <div class="settings-item awtrix-cloud-hint">
      Save to Cloud publishes the icon to the shared icon database right away.
      It needs an AWTRIX Hub account, so from the clock's own page it will point
      you at the Hub editor instead.
    </div>
    <div class="settings-title">Open from AWTRIX</div>
    <div class="settings-item">
      <select id="awtrix-open-list">
        <option value="">Loading…</option>
      </select>
    </div>
  </div>
</script>
